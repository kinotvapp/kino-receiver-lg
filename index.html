<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kino Receptor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="receiver.css">
</head>
<body>
<video id="v"></video>
<div id="idle">
  <svg class="logo" viewBox="0 0 108 108" width="190" height="190"><circle cx="54" cy="54" r="24.615" fill="none" stroke="#fff" stroke-width="10.769"/><circle cx="54" cy="54" r="9.385" fill="#e53224"/></svg>
  <div id="idleTitle" class="big"></div>
  <div id="idleHint" class="hint"></div>
</div>
<div id="spin" class="spin hidden"></div>
<div id="hud" class="hidden">
  <div id="scrimL"></div>
  <div id="scrimB"></div>
  <div id="card">
    <img id="poster" class="nopic" alt="">
    <div id="info">
      <div id="hudTitle"></div>
      <div id="hudMeta"></div>
      <div id="chips"></div>
    </div>
  </div>
  <div id="bigpause" class="hidden">
    <svg viewBox="0 0 24 24" width="76" height="76"><rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="#fff"/><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="#fff"/></svg>
  </div>
  <div id="bottom">
    <div id="state">
      <svg id="iconPause" viewBox="0 0 24 24" width="64" height="64"><rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="#fff"/><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="#fff"/></svg>
      <svg id="iconPlay" class="hidden" viewBox="0 0 24 24" width="64" height="64"><path d="M7 4.6v14.8c0 .8.9 1.3 1.6.8l11-7.4c.6-.4.6-1.2 0-1.6l-11-7.4C7.9 3.3 7 3.8 7 4.6z" fill="#fff"/></svg>
    </div>
    <div id="barWrap">
      <div id="bar"><div id="barFill"></div><div id="barKnob"></div></div>
      <div id="times"><span id="tNow"></span><span id="tEnd"></span></div>
    </div>
  </div>
</div>
<div id="flash"></div>
<div id="note" class="hidden"></div>
<script src="receiver.js"></script>
</body>
</html>
